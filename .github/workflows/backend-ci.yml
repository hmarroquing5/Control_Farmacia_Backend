name: .NET Core - CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 1. ETAPA: Build (Compilación y empaquetado)
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    # 2. ETAPA: Lint / Análisis estático (Verificación de estándares de código)
    - name: Inspect Code Standards (Dotnet Format)
      run: dotnet format --severity warn

    # 3. ETAPA: Test (Ejecución automatizada y reporte de cobertura mínima)
    - name: Test and Collect Coverage
      run: |
        dotnet test --no-build --configuration Release \
        --collect:"XPlat Code Coverage" \
        /p:Threshold=60 \
        /p:ThresholdType=line
